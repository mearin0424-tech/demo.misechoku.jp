name: Smoke Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  php-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=
      APP_URL: http://localhost
      BCRYPT_ROUNDS: 4
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      VIEW_COMPILED_PATH: storage/framework/views

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: mbstring, pdo_mysql, openssl, dom, xml, xmlwriter

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Prepare Laravel environment
        run: |
          cp .env.testing .env
          mkdir -p storage/framework/views
          mkdir -p bootstrap/cache

      - name: Sync Composer lock for CI
        run: composer update minishlink/web-push --no-interaction --prefer-dist

      - name: Run migrations for testing
        run: php artisan migrate:fresh --env=testing --force -v

      - name: Run smoke tests with debug output
        run: vendor/bin/phpunit tests/Feature/Smoke --stop-on-error --debug

      - name: Upload Laravel logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-logs
          path: storage/logs
          if-no-files-found: ignore
