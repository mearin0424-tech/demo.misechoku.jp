<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LIKES - NightWork App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .pb-safe { padding-bottom: max(16px, env(safe-area-inset-bottom, 16px)); }
        .pt-safe { padding-top: max(8px, env(safe-area-inset-top, 8px)); }
        body { background-color: #050505; color: #F5F5F5; font-family: 'Noto Sans JP', sans-serif; overflow: hidden; height: 100dvh; width: 100vw; -webkit-tap-highlight-color: transparent; }
        .app-title { font-family: 'Montserrat', 'Noto Sans JP', sans-serif; font-weight: 700; letter-spacing: 0.05em; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div class="h-full w-full max-w-[430px] mx-auto bg-[#050505] flex flex-col relative overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.8)]">
        
        <header class="absolute top-0 left-0 w-full z-40 flex items-center justify-between px-5 py-4 bg-[#050505]/65 backdrop-blur-xl border-b border-[#CBA6D9]/40 shadow-lg pt-safe">
            <div class="w-12"></div>
            <h1 class="app-title text-[16px] font-bold text-[#F5F5F5] text-center absolute left-1/2 -translate-x-1/2 uppercase">Likes</h1>
            <div class="text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4] cursor-pointer"><i class="ph-bold ph-bell text-[20px]"></i></div>
        </header>

        <div class="absolute inset-0 w-full h-full overflow-y-auto scrollbar-hide pb-[100px] pt-[72px] px-4 z-10">
            
            <div class="flex items-center justify-between mb-4 mt-4">
                <h2 class="text-[#F5F5F5] font-bold text-[15px]">キープしたお店 <span class="text-[11px] text-[#A0A0A0] font-normal ml-1">1件</span></h2>
            </div>
            
            <!-- Liked Card -->
            <div class="flex flex-col gap-4 mb-8">
                <div class="bg-transparent border border-[#CBA6D9]/40 rounded-[20px] shadow-[8px_8px_20px_rgba(0,0,0,0.8),-2px_-2px_8px_rgba(255,255,255,0.03)] p-3 flex gap-4 group cursor-pointer hover:border-[#CBA6D9] transition-colors">
                    <div class="shrink-0 w-[80px] h-[80px] rounded-[16px] overflow-hidden border border-[#CBA6D9]/40 shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)] relative">
                        <img src="https://images.unsplash.com/photo-1585553616435-2dc0a54e271d?auto=format&fit=crop&w=300&q=80" class="w-full h-full object-cover" />
                    </div>
                    <div class="flex-1 min-w-0 py-1">
                        <div class="flex justify-between items-start">
                            <h3 class="text-[#F5F5F5] app-title font-bold text-[15px] truncate">Club Luminous</h3>
                            <i class="ph-fill ph-heart text-[18px] text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4]"></i>
                        </div>
                        <div class="flex items-center gap-2 text-[10px] mt-1 mb-2">
                            <span class="text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4] bg-transparent border border-[#CBA6D9]/40 px-1.5 py-0.5 rounded shadow-[inset_0_1px_2px_rgba(0,0,0,0.5)]">高級ラウンジ</span>
                            <span class="text-[#A0A0A0] flex items-center">東京都 港区</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4] text-[10px] font-bold whitespace-nowrap">体入時給</span>
                            <span class="text-white text-[14px] font-bold tracking-tight">¥8,000〜</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recommendations -->
            <div class="flex items-center gap-2 mb-4 border-t border-[#CBA6D9]/20 pt-6">
                <i class="ph-fill ph-sparkle text-[18px] text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4]"></i>
                <h2 class="text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4] font-bold text-[14px] tracking-wide">キープ傾向からのおすすめ</h2>
            </div>

            <div class="flex flex-col gap-4 mb-4">
                <div class="bg-transparent border border-[#CBA6D9]/40 rounded-[20px] shadow-[8px_8px_20px_rgba(0,0,0,0.8),-2px_-2px_8px_rgba(255,255,255,0.03)] p-3 flex gap-4 group cursor-pointer hover:border-[#CBA6D9] transition-colors">
                    <div class="shrink-0 w-[80px] h-[80px] rounded-[16px] overflow-hidden border border-[#CBA6D9]/40 shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)] relative">
                        <img src="https://images.unsplash.com/photo-1543007630-9710e4a00a20?auto=format&fit=crop&w=300&q=80" class="w-full h-full object-cover" />
                        <div class="absolute bottom-0 left-0 w-full bg-[#050505]/65 backdrop-blur-md border-t border-[#CBA6D9]/40 text-[9px] text-center text-white py-0.5 font-bold tracking-widest truncate px-1">業種・エリアが一致</div>
                    </div>
                    <div class="flex-1 min-w-0 py-1">
                        <div class="flex justify-between items-start">
                            <h3 class="text-[#F5F5F5] app-title font-bold text-[15px] truncate">Lounge SECRET</h3>
                            <i class="ph-bold ph-heart text-[18px] text-[#A0A0A0] hover:text-[#CBA6D9] transition-colors"></i>
                        </div>
                        <div class="flex items-center gap-2 text-[10px] mt-1 mb-2">
                            <span class="text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4] bg-transparent border border-[#CBA6D9]/40 px-1.5 py-0.5 rounded shadow-[inset_0_1px_2px_rgba(0,0,0,0.5)]">高級ラウンジ</span>
                            <span class="text-[#A0A0A0] flex items-center">東京都 港区</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4] text-[10px] font-bold whitespace-nowrap">体入時給</span>
                            <span class="text-white text-[14px] font-bold tracking-tight">¥8,000〜</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <nav class="absolute bottom-0 left-0 w-full bg-[#050505]/65 backdrop-blur-xl border-t border-[#CBA6D9]/40 shadow-[0_-4px_20px_rgba(0,0,0,0.5)] z-50 pb-safe">
            <div class="flex justify-around items-center pt-3 pb-2 px-2">
                <button onclick="window.location.href='swipe.html'" class="flex flex-col items-center p-2 group cursor-pointer text-[#A0A0A0] hover:text-white transition-colors"><i class="ph-fill ph-house text-[22px] mb-1.5 group-hover:scale-95 transition-transform"></i><span class="app-title text-[9px] font-bold tracking-widest group-hover:text-white">SWIPE</span></button>
                <button onclick="window.location.href='search.html'" class="flex flex-col items-center p-2 group cursor-pointer text-[#A0A0A0] hover:text-white transition-colors"><i class="ph-bold ph-magnifying-glass text-[22px] mb-1.5 group-hover:scale-95 transition-transform"></i><span class="app-title text-[9px] font-bold tracking-widest group-hover:text-white">SEARCH</span></button>
                <button class="flex flex-col items-center p-2 group cursor-pointer text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4]"><i class="ph-fill ph-heart text-[22px] mb-1.5 scale-110 text-[#CBA6D9]"></i><span class="app-title text-[9px] font-bold tracking-widest drop-shadow-md text-[#CBA6D9]">LIKES</span></button>
                <button onclick="console.log('Talk screen not generated in this set')" class="flex flex-col items-center p-2 group cursor-pointer text-[#A0A0A0] hover:text-white transition-colors"><i class="ph-fill ph-chat-teardrop-text text-[22px] mb-1.5 group-hover:scale-95 transition-transform"></i><span class="app-title text-[9px] font-bold tracking-widest group-hover:text-white">TALK</span></button>
                <button onclick="window.location.href='mypage.html'" class="flex flex-col items-center p-2 group cursor-pointer text-[#A0A0A0] hover:text-white transition-colors"><i class="ph-fill ph-user text-[22px] mb-1.5 group-hover:scale-95 transition-transform"></i><span class="app-title text-[9px] font-bold tracking-widest group-hover:text-white">MY PAGE</span></button>
            </div>
        </nav>
    </div>
</body>
</html>
