<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SEARCH - NightWork App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .pb-safe { padding-bottom: max(16px, env(safe-area-inset-bottom, 16px)); }
        .pt-safe { padding-top: max(8px, env(safe-area-inset-top, 8px)); }
        body { background-color: #050505; color: #F5F5F5; font-family: 'Noto Sans JP', sans-serif; overflow: hidden; height: 100dvh; width: 100vw; -webkit-tap-highlight-color: transparent; }
        .app-title { font-family: 'Montserrat', 'Noto Sans JP', sans-serif; font-weight: 700; letter-spacing: 0.05em; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div class="h-full w-full max-w-[430px] mx-auto bg-[#050505] flex flex-col relative overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.8)]">
        
        <header class="absolute top-0 left-0 w-full z-40 flex items-center justify-between px-5 py-4 bg-[#050505]/65 backdrop-blur-xl border-b border-[#CBA6D9]/40 shadow-lg pt-safe">
            <div class="w-12"></div>
            <h1 class="app-title text-[16px] font-bold text-[#F5F5F5] text-center absolute left-1/2 -translate-x-1/2 uppercase">Search</h1>
            <div class="text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4] cursor-pointer"><i class="ph-bold ph-bell text-[20px]"></i></div>
        </header>

        <div class="absolute inset-0 w-full h-full overflow-y-auto scrollbar-hide pb-[100px] pt-[68px] z-10">
            <div class="flex bg-transparent border-b border-[#CBA6D9]/40 shrink-0 relative px-4 pt-2">
                <button class="flex-1 py-3 text-[13px] font-bold relative text-[#F5F5F5]">
                    検索
                    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-12 h-1 rounded-t-full bg-[#CBA6D9]"></div>
                </button>
                <button class="flex-1 py-3 text-[13px] font-bold relative flex items-center justify-center gap-1 text-[#A0A0A0]">
                    <i class="ph-fill ph-sparkle text-[14px] text-[#A0A0A0]"></i>
                    AIレコメンド
                </button>
            </div>

            <div class="px-5 py-4 bg-transparent border-b border-[#CBA6D9]/40">
                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <input type="text" placeholder="エリア・店名で検索..." class="w-full bg-[#F5F0F7] text-[#1A1A1A] placeholder-gray-500 border-transparent shadow-[inset_0_2px_4px_rgba(0,0,0,0.1)] rounded-full py-3 px-4 text-sm focus:outline-none transition-all" />
                    </div>
                    <button class="w-[46px] h-[46px] rounded-full bg-[#CBA6D9] shadow-[inset_0_2px_4px_rgba(255,255,255,0.4),inset_0_-4px_4px_rgba(0,0,0,0.3),0_6px_12px_rgba(0,0,0,0.8)] border border-transparent flex items-center justify-center shrink-0 active:translate-y-1">
                        <i class="ph-bold ph-magnifying-glass text-[20px] text-[#111]"></i>
                    </button>
                </div>
            </div>

            <div class="flex flex-col px-4 pt-5 gap-5 pb-[40px]">
                
                <div class="bg-transparent border border-[#CBA6D9]/40 rounded-[20px] shadow-[8px_8px_20px_rgba(0,0,0,0.8),-2px_-2px_8px_rgba(255,255,255,0.03)] p-4 flex gap-4 group cursor-pointer">
                    <div class="shrink-0 w-[72px] flex flex-col items-center gap-2">
                        <div class="w-[72px] h-[72px] bg-transparent border border-[#CBA6D9]/40 rounded-[16px] overflow-hidden relative shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)]">
                            <img src="https://images.unsplash.com/photo-1585553616435-2dc0a54e271d?auto=format&fit=crop&w=300&q=80" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                        </div>
                        <div class="flex items-center justify-center gap-1 bg-gradient-to-r from-[#D4AF37] to-[#B8860B] text-[#111] text-[9px] font-bold px-1.5 py-0.5 rounded w-full relative -mt-4 z-10 shadow-[inset_0_2px_4px_rgba(255,255,255,0.4),inset_0_-4px_4px_rgba(0,0,0,0.3),0_6px_12px_rgba(0,0,0,0.8)] border border-[#D4AF37]/30">
                            <i class="ph-fill ph-crown text-[10px]"></i><span>優良店</span>
                        </div>
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col pt-1">
                        <div class="flex items-center justify-between mb-1.5">
                            <h3 class="text-[#F5F5F5] app-title font-bold text-[17px] truncate group-hover:text-transparent group-hover:bg-clip-text group-hover:bg-gradient-to-b group-hover:from-[#E3C9EF] group-hover:to-[#B388C4] transition-colors">Club Luminous</h3>
                        </div>
                        <div class="flex items-center flex-wrap text-[11px] mb-2.5 gap-x-2 gap-y-2">
                            <span class="text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4] bg-transparent border border-[#CBA6D9]/40 px-2 py-0.5 rounded font-medium shadow-[inset_0_1px_2px_rgba(0,0,0,0.5)]">キャバクラ</span>
                            <span class="flex items-center text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4] font-bold bg-transparent border border-[#CBA6D9]/40 px-1.5 py-0.5 rounded shadow-[inset_0_1px_2px_rgba(0,0,0,0.5)]"><i class="ph-fill ph-star text-[12px] mr-0.5 text-[#CBA6D9]"></i>4.8</span>
                            <span class="flex items-center text-[#A0A0A0]"><i class="ph-fill ph-map-pin text-[11px] mr-0.5"></i>東京都中央区</span>
                        </div>
                        <p class="text-[13px] text-[#F5F5F5] opacity-90 leading-relaxed line-clamp-2">今から入れます♡ 未経験の女の子も大歓迎！体験入店からの即日体入も可能です✨</p>
                    </div>
                </div>

                <div class="bg-transparent border border-[#CBA6D9]/40 rounded-[20px] shadow-[8px_8px_20px_rgba(0,0,0,0.8),-2px_-2px_8px_rgba(255,255,255,0.03)] p-4 flex gap-4 group cursor-pointer">
                    <div class="shrink-0 w-[72px] flex flex-col items-center gap-2">
                        <div class="w-[72px] h-[72px] bg-transparent border border-[#CBA6D9]/40 rounded-[16px] overflow-hidden relative shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)]">
                            <img src="https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?auto=format&fit=crop&w=300&q=80" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                        </div>
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col pt-1">
                        <div class="flex items-center justify-between mb-1.5">
                            <h3 class="text-[#F5F5F5] app-title font-bold text-[17px] truncate group-hover:text-transparent group-hover:bg-clip-text group-hover:bg-gradient-to-b group-hover:from-[#E3C9EF] group-hover:to-[#B388C4] transition-colors">CUTE</h3>
                        </div>
                        <div class="flex items-center flex-wrap text-[11px] mb-2.5 gap-x-2 gap-y-2">
                            <span class="text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4] bg-transparent border border-[#CBA6D9]/40 px-2 py-0.5 rounded font-medium shadow-[inset_0_1px_2px_rgba(0,0,0,0.5)]">ガールズバー</span>
                            <span class="flex items-center text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4] font-bold bg-transparent border border-[#CBA6D9]/40 px-1.5 py-0.5 rounded shadow-[inset_0_1px_2px_rgba(0,0,0,0.5)]"><i class="ph-fill ph-star text-[12px] mr-0.5 text-[#CBA6D9]"></i>4.5</span>
                            <span class="flex items-center text-[#A0A0A0]"><i class="ph-fill ph-map-pin text-[11px] mr-0.5"></i>東京都江戸川区</span>
                        </div>
                        <p class="text-[13px] text-[#F5F5F5] opacity-90 leading-relaxed line-clamp-2">西葛西にて新規オープン！オープニングメンバーを大募集してます🎀</p>
                    </div>
                </div>
            </div>
        </div>

        <button class="absolute bottom-[90px] right-5 w-[56px] h-[56px] rounded-full flex items-center justify-center bg-gradient-to-r from-[#E3C9EF] to-[#B388C4] text-[#111] shadow-[inset_0_2px_4px_rgba(255,255,255,0.4),inset_0_-4px_4px_rgba(0,0,0,0.3),0_8px_16px_rgba(0,0,0,0.8)] active:translate-y-1 z-30">
            <i class="ph-bold ph-sliders-horizontal text-[24px]"></i>
        </button>

        <nav class="absolute bottom-0 left-0 w-full bg-[#050505]/65 backdrop-blur-xl border-t border-[#CBA6D9]/40 shadow-[0_-4px_20px_rgba(0,0,0,0.5)] z-50 pb-safe">
            <div class="flex justify-around items-center pt-3 pb-2 px-2">
                <button onclick="window.location.href='swipe.html'" class="flex flex-col items-center p-2 group cursor-pointer text-[#A0A0A0] hover:text-white transition-colors"><i class="ph-fill ph-house text-[22px] mb-1.5 group-hover:scale-95 transition-transform"></i><span class="app-title text-[9px] font-bold tracking-widest group-hover:text-white">SWIPE</span></button>
                <button class="flex flex-col items-center p-2 group cursor-pointer text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4]"><i class="ph-bold ph-magnifying-glass text-[22px] mb-1.5 scale-110 text-[#CBA6D9]"></i><span class="app-title text-[9px] font-bold tracking-widest drop-shadow-md text-[#CBA6D9]">SEARCH</span></button>
                <button onclick="window.location.href='likes.html'" class="flex flex-col items-center p-2 group cursor-pointer text-[#A0A0A0] hover:text-white transition-colors"><i class="ph-fill ph-heart text-[22px] mb-1.5 group-hover:scale-95 transition-transform"></i><span class="app-title text-[9px] font-bold tracking-widest group-hover:text-white">LIKES</span></button>
                <button onclick="console.log('Talk screen not generated in this set')" class="flex flex-col items-center p-2 group cursor-pointer text-[#A0A0A0] hover:text-white transition-colors"><i class="ph-fill ph-chat-teardrop-text text-[22px] mb-1.5 group-hover:scale-95 transition-transform"></i><span class="app-title text-[9px] font-bold tracking-widest group-hover:text-white">TALK</span></button>
                <button onclick="window.location.href='mypage.html'" class="flex flex-col items-center p-2 group cursor-pointer text-[#A0A0A0] hover:text-white transition-colors"><i class="ph-fill ph-user text-[22px] mb-1.5 group-hover:scale-95 transition-transform"></i><span class="app-title text-[9px] font-bold tracking-widest group-hover:text-white">MY PAGE</span></button>
            </div>
        </nav>
    </div>
</body>
</html>
