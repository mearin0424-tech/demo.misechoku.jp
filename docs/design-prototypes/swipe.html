<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SWIPE - NightWork App</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .pb-safe { padding-bottom: max(16px, env(safe-area-inset-bottom, 16px)); }
        .pt-safe { padding-top: max(8px, env(safe-area-inset-top, 8px)); }
        body { background-color: #050505; color: #F5F5F5; font-family: 'Noto Sans JP', sans-serif; overflow: hidden; height: 100dvh; width: 100vw; -webkit-tap-highlight-color: transparent; }
        .app-title { font-family: 'Montserrat', 'Noto Sans JP', sans-serif; font-weight: 700; letter-spacing: 0.05em; }
        /* 文字の視認性を高める強いシャドウ */
        .text-shadow-heavy { text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 4px 12px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="h-full w-full max-w-[430px] mx-auto bg-[#050505] flex flex-col relative overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.8)]">
        
        <!-- Header (Glassmorphism) -->
        <header class="absolute top-0 left-0 w-full z-40 flex items-center justify-between px-5 py-4 bg-[#050505]/65 backdrop-blur-xl border-b border-[#CBA6D9]/40 shadow-lg pt-safe pointer-events-none">
            <div class="w-12"></div>
            <h1 class="app-title text-[16px] font-bold text-center absolute left-1/2 -translate-x-1/2 uppercase text-[#F5F5F5]">Discovery</h1>
            <div class="flex items-center gap-4 pointer-events-auto cursor-pointer">
                <i class="ph-bold ph-bell text-[20px] text-white drop-shadow-md relative">
                    <span class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border-2 border-black bg-[#CBA6D9]"></span>
                </i>
            </div>
        </header>

        <!-- Main Card Area (Drag interactions handled by JS) -->
        <div id="swipe-container" class="flex-1 relative w-full h-full cursor-grab active:cursor-grabbing">
            <div id="current-card" class="absolute top-0 left-0 w-full h-full flex flex-col z-10 transition-transform duration-300">
                <!-- Progress Bar -->
                <div class="absolute top-20 left-5 right-5 flex gap-1.5 z-20 pointer-events-none">
                    <div class="h-1 flex-1 rounded-full bg-[#CBA6D9] shadow-sm indicator"></div>
                    <div class="h-1 flex-1 rounded-full bg-white/30 shadow-sm indicator"></div>
                </div>

                <!-- Background Image (Carousel) -->
                <div class="absolute inset-0 overflow-hidden pointer-events-none bg-black">
                    <div id="image-track" class="w-full h-full flex transition-transform duration-300">
                        <img src="https://images.unsplash.com/photo-1585553616435-2dc0a54e271d?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover shrink-0" draggable="false" />
                        <img src="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover shrink-0" draggable="false" />
                    </div>
                    <!-- Heavy Bottom Fade for text readability -->
                    <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-transparent to-[#050505] opacity-95"></div>
                    <div class="absolute bottom-0 left-0 w-full h-[75%] bg-gradient-to-t from-[#050505] via-[#050505]/80 to-transparent"></div>
                </div>
                
                <!-- Text Info Area -->
                <div class="absolute inset-0 z-10 flex flex-col justify-end p-6 pb-44 pointer-events-none">
                    
                    <!-- Side Buttons -->
                    <div class="absolute right-4 bottom-[30%] flex flex-col gap-6 z-30 pointer-events-auto">
                        <div class="flex flex-col items-center gap-1.5 cursor-pointer hover:scale-105 active:scale-90 transition-transform">
                            <div class="w-[60px] h-[60px] rounded-full bg-black/60 backdrop-blur-lg border-[1.5px] border-white/40 flex items-center justify-center shadow-[0_8px_20px_rgba(0,0,0,0.6)]">
                                <i class="ph-fill ph-heart text-[30px] text-transparent bg-clip-text bg-gradient-to-r from-[#E3C9EF] to-[#B388C4] drop-shadow-[0_0_8px_rgba(255,255,255,0.3)]"></i>
                            </div>
                        </div>
                        <div class="flex flex-col items-center gap-1.5 cursor-pointer hover:scale-105 active:scale-90 transition-transform">
                            <div class="w-[60px] h-[60px] rounded-full bg-black/60 backdrop-blur-lg border-[1.5px] border-white/40 flex items-center justify-center shadow-[0_8px_20px_rgba(0,0,0,0.6)]">
                                <i class="ph-fill ph-chat-teardrop-text text-[30px] text-transparent bg-clip-text bg-gradient-to-r from-[#E3C9EF] to-[#B388C4] drop-shadow-[0_0_8px_rgba(255,255,255,0.3)]"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Catchphrase -->
                    <div class="mb-auto mt-24 flex justify-center">
                        <div class="bg-[#121212]/80 backdrop-blur-md border border-[#CBA6D9]/40 px-4 py-1.5 rounded-full shadow-sm">
                            <span class="text-[#F5F5F5] font-bold tracking-widest text-[11px] whitespace-nowrap">エリア最高峰の高級ラウンジ</span>
                        </div>
                    </div>
                    
                    <!-- Store Details -->
                    <div class="flex flex-col max-w-[75%] pointer-events-auto">
                        <h2 class="text-[34px] app-title font-bold text-white mb-2 leading-tight text-shadow-heavy">Club Luminous</h2>
                        <div class="flex items-center gap-3 mb-4 text-shadow-heavy">
                            <div class="flex items-center gap-1"><i class="ph-fill ph-star text-[14px] text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4]"></i><span class="font-bold text-[14px] text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4]">4.8</span><span class="text-[#A0A0A0] text-[11px] ml-1">(24)</span></div>
                            <div class="flex items-center text-[#A0A0A0] text-[11px]"><i class="ph-fill ph-map-pin text-[12px] mr-1 text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4]"></i>東京都 港区</div>
                        </div>
                        <div class="inline-flex items-center gap-4 mb-4 self-start px-4 py-2.5 rounded-full text-[#111] font-bold bg-gradient-to-r from-[#D4AF37] to-[#B8860B] shadow-[inset_0_4px_6px_rgba(255,255,255,0.4),inset_0_-6px_6px_rgba(0,0,0,0.4),0_12px_24px_rgba(0,0,0,0.7)] border border-[#D4AF37]/30">
                            <span class="text-[9px] tracking-wider opacity-90">ボーナス金</span>
                            <span class="text-[16px] tracking-wider font-extrabold">¥100,000</span>
                        </div>
                        <div class="flex flex-col gap-2 text-shadow-heavy">
                            <div class="flex items-center gap-3"><span class="text-[11px] font-bold text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4] whitespace-nowrap w-[50px]">体入時給</span><span class="text-[24px] font-bold text-[#F5F5F5] tracking-tight leading-none">¥8,000〜</span></div>
                            <div class="flex items-center gap-3"><span class="text-[11px] font-bold text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4] whitespace-nowrap w-[50px]">ヘルプ時給</span><span class="text-[18px] text-[#A0A0A0] font-medium leading-none">¥4,000</span></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Next Card Placeholder (Behind) -->
            <div id="next-card" class="absolute top-0 left-0 w-full h-full flex flex-col z-0 transition-transform duration-300 transform scale-95 translate-y-6">
                 <div class="absolute inset-0 overflow-hidden bg-black pointer-events-none">
                    <img src="https://images.unsplash.com/photo-1514933651103-005eec06c04b?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover opacity-50" />
                </div>
            </div>
        </div>

        <!-- Guide -->
        <div class="absolute bottom-[100px] left-1/2 -translate-x-1/2 flex flex-col items-center opacity-80 animate-bounce pointer-events-none z-20">
            <i class="ph-bold ph-caret-up text-[20px] text-white"></i>
            <span class="app-title text-white text-[9px] font-bold tracking-[0.2em] text-center mt-1">SWIPE UP<br>TO NEXT</span>
        </div>

        <!-- Bottom Navigation -->
        <nav class="absolute bottom-0 left-0 w-full bg-[#050505]/65 backdrop-blur-xl border-t border-[#CBA6D9]/40 shadow-[0_-4px_20px_rgba(0,0,0,0.5)] z-50 pb-safe">
            <div class="flex justify-around items-center pt-3 pb-2 px-2">
                <button class="flex flex-col items-center p-2 group cursor-pointer text-transparent bg-clip-text bg-gradient-to-b from-[#E3C9EF] to-[#B388C4]">
                    <i class="ph-fill ph-house text-[22px] mb-1.5 scale-110"></i>
                    <span class="app-title text-[9px] font-bold tracking-widest drop-shadow-md text-[#CBA6D9]">SWIPE</span>
                </button>
                <button onclick="window.location.href='search.html'" class="flex flex-col items-center p-2 group cursor-pointer text-[#A0A0A0] hover:text-white transition-colors">
                    <i class="ph-bold ph-magnifying-glass text-[22px] mb-1.5 group-hover:scale-95 transition-transform"></i>
                    <span class="app-title text-[9px] font-bold tracking-widest">SEARCH</span>
                </button>
                <button onclick="window.location.href='likes.html'" class="flex flex-col items-center p-2 group cursor-pointer text-[#A0A0A0] hover:text-white transition-colors">
                    <i class="ph-fill ph-heart text-[22px] mb-1.5 group-hover:scale-95 transition-transform"></i>
                    <span class="app-title text-[9px] font-bold tracking-widest">LIKES</span>
                </button>
                <button onclick="console.log('Talk screen not generated in this set')" class="flex flex-col items-center p-2 group cursor-pointer text-[#A0A0A0] hover:text-white transition-colors">
                    <i class="ph-fill ph-chat-teardrop-text text-[22px] mb-1.5 group-hover:scale-95 transition-transform"></i>
                    <span class="app-title text-[9px] font-bold tracking-widest">TALK</span>
                </button>
                <button onclick="window.location.href='mypage.html'" class="flex flex-col items-center p-2 group cursor-pointer text-[#A0A0A0] hover:text-white transition-colors">
                    <i class="ph-fill ph-user text-[22px] mb-1.5 group-hover:scale-95 transition-transform"></i>
                    <span class="app-title text-[9px] font-bold tracking-widest">MY PAGE</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- JS for Swipe Logic Mockup -->
    <script>
        const container = document.getElementById('swipe-container');
        const card = document.getElementById('current-card');
        const track = document.getElementById('image-track');
        const indicators = document.querySelectorAll('.indicator');
        
        let startX = 0, startY = 0, currentX = 0, currentY = 0;
        let isDragging = false;
        let imageIndex = 0;

        const handleStart = (e) => {
            isDragging = true;
            startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            card.style.transition = 'none';
            track.style.transition = 'none';
        };

        const handleMove = (e) => {
            if (!isDragging) return;
            const x = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const y = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            currentX = x - startX;
            currentY = y - startY;

            // 縦に大きく動かした場合はカード全体を動かす、横の場合は画像をスライド
            if (Math.abs(currentY) > Math.abs(currentX)) {
                card.style.transform = `translateY(${currentY}px)`;
            } else {
                track.style.transform = `translateX(calc(-${imageIndex * 100}% + ${currentX}px))`;
            }
        };

        const handleEnd = () => {
            if (!isDragging) return;
            isDragging = false;
            card.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            track.style.transition = 'transform 0.3s ease-out';

            const threshold = 60;
            if (Math.abs(currentY) > Math.abs(currentX) && Math.abs(currentY) > threshold) {
                // 上下スワイプ (疑似的にカードを消して戻す)
                card.style.transform = `translateY(${currentY < 0 ? -window.innerHeight : window.innerHeight}px)`;
                setTimeout(() => { card.style.transform = 'translateY(0)'; }, 300);
            } else if (Math.abs(currentX) > Math.abs(currentY) && Math.abs(currentX) > threshold) {
                // 左右スワイプ (画像切替)
                if (currentX < 0 && imageIndex < 1) imageIndex++;
                else if (currentX > 0 && imageIndex > 0) imageIndex--;
                track.style.transform = `translateX(-${imageIndex * 100}%)`;
                indicators.forEach((el, i) => {
                    el.className = i === imageIndex ? 'h-1 flex-1 rounded-full bg-[#CBA6D9] shadow-sm indicator' : 'h-1 flex-1 rounded-full bg-white/30 shadow-sm indicator';
                });
            } else {
                // 元に戻る
                card.style.transform = 'translateY(0)';
                track.style.transform = `translateX(-${imageIndex * 100}%)`;
            }
            currentX = 0; currentY = 0;
        };

        container.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        container.addEventListener('touchstart', handleStart);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);
    </script>
</body>
</html>
